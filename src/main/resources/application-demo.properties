# Ambiente isolado para apresentacao do SGL
# Usa H2 em memoria para nao alterar o PostgreSQL de desenvolvimento.

spring.datasource.url=jdbc:h2:mem:sgl-demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.h2.console.enabled=true


# Corporate API gateway (credentials come from the environment only)
sgl.corporate.base-url=${SGL_CORPORATE_BASE_URL:https://api-gateway-devhomol.nuvem.ti.embrapa.br}
sgl.corporate.ambiente=${SGL_CORPORATE_AMBIENTE:h}
sgl.corporate.username=${SGL_CORPORATE_USERNAME:}
sgl.corporate.password=${SGL_CORPORATE_PASSWORD:}
