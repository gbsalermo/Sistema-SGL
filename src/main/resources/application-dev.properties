
#Ambiente de desenvolvimento do PostgreSQL

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgl}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWD:}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# Corporate API gateway (credentials come from the environment only)
sgl.corporate.base-url=${SGL_CORPORATE_BASE_URL:https://api-gateway-devhomol.nuvem.ti.embrapa.br}
sgl.corporate.ambiente=${SGL_CORPORATE_AMBIENTE:h}
# dev/demo start without corporate credentials; corporate login then answers 503
sgl.corporate.required=false
sgl.corporate.username=${SGL_CORPORATE_USERNAME:}
sgl.corporate.password=${SGL_CORPORATE_PASSWORD:}

# JWT: the fallback secret is for local dev/demo ONLY and must never be used elsewhere.
sgl.jwt.secret=${SGL_JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-prod-0123456789}
