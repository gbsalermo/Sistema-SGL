# =============================================================================
# Ambiente de PRODUÇÃO (ativado pelo docker-compose.yml: SPRING_PROFILES_ACTIVE=prod)
#
# Endereço, usuário e senha do banco NÃO ficam aqui: chegam pelas variáveis de
# ambiente SPRING_DATASOURCE_URL/USERNAME/PASSWORD, definidas no docker-compose.yml
# a partir do arquivo de segredos do servidor (/opt/sgl/env/api.env).
# Os initializers de massa de dados e o login DEV só existem nos profiles "dev" e
# "demo", então o banco de produção começa só com as migrations.
# =============================================================================

# O schema é responsabilidade do Flyway (db/migration). O Hibernate só confere se as
# entidades batem com as tabelas e, se não baterem, a aplicação nem sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Não imprimir SQL no log (o application.properties liga isso para desenvolvimento).
spring.jpa.show-sql=false

# Console web do H2 nunca em produção.
spring.h2.console.enabled=false

# Documentação da API (Swagger/OpenAPI) desligada em produção: ela lista todas as rotas e
# os formatos de requisição para qualquer um que alcance o servidor.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# APIs corporativas: gateway de produção (sufixo -p). Usuário e senha vêm de
# SGL_CORPORATE_USERNAME/PASSWORD; sem eles a API não sobe (sgl.corporate.required=true).
sgl.corporate.base-url=${SGL_CORPORATE_BASE_URL:https://api-gateway.nuvem.ti.embrapa.br}
sgl.corporate.ambiente=${SGL_CORPORATE_AMBIENTE:p}
sgl.corporate.username=${SGL_CORPORATE_USERNAME}
sgl.corporate.password=${SGL_CORPORATE_PASSWORD}
