
#H2 BANCO DE TESTE

# Um banco H2 por contexto Spring: com um nome fixo, os contextos em cache dividiam o mesmo
# banco, e o create-drop de um contexto que fechava apagava as tabelas dos outros (erros
# "Table ... not found" que mudavam de classe conforme a ordem dos testes).
spring.datasource.url=jdbc:h2:mem:sgldb-${random.uuid}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true

spring.flyway.enabled=false

# Corporate API gateway: fake values, tests never reach a real gateway
sgl.corporate.base-url=http://localhost:0
sgl.corporate.ambiente=h
sgl.corporate.username=test
sgl.corporate.password=test

# JWT: fixed secret for tests only
sgl.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes-0123456789
