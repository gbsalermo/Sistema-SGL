spring.application.name=sgl-backend

# Desenvolvimento normal usa PostgreSQL.
# O profile demo (H2) deve ser ativado explicitamente quando necessario.
spring.profiles.active=dev

# SERVIDOR
server.port=8080

# JPA
spring.jpa.show-sql=true

# JWT session token. No default here: profiles without their own value fail at startup
# unless SGL_JWT_SECRET (at least 32 bytes) is set.
sgl.jwt.secret=${SGL_JWT_SECRET}
sgl.jwt.expiration=PT5H
