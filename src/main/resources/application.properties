spring.application.name=sgl-backend

# No default profile on purpose: dev/demo enable the password-less DEV login, a known JWT secret
# and seed users. Run locally with -Dspring-boot.run.profiles=dev (PostgreSQL) or demo (H2).

# SERVIDOR
server.port=8080

# JPA
spring.jpa.show-sql=true
# The SGL logs the constraint name itself; Hibernate's own log would repeat the duplicated value (e.g. a CPF).
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# JWT session token. No default here: profiles without their own value fail at startup
# unless SGL_JWT_SECRET (at least 32 bytes) is set.
sgl.jwt.secret=${SGL_JWT_SECRET}
sgl.jwt.expiration=PT5H

# First-deploy bootstrap: the first corporate login becomes ADMINISTRADOR_GERAL while none exists.
sgl.auth.primeiro-login-admin=${SGL_PRIMEIRO_LOGIN_ADMIN:false}

# CORS: comma-separated list of frontend origins allowed to call the API
sgl.cors.allowed-origins=${SGL_CORS_ALLOWED_ORIGINS:http://localhost:5173}
